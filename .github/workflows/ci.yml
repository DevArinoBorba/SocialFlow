name: CI & Container Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Test & Foundation Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build packages
        run: pnpm build

      - name: Run linter
        run: pnpm lint

      - name: Verify code formatting
        run: pnpm format:check

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Security audit
        run: pnpm audit --prod --audit-level high

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run foundation drill
        run: pnpm test:foundation

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            test-results/*.png
            .local/socialflow-acceptance-*/result.json
          include-hidden-files: true

  docker:
    name: Build & Publish Container Image
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/devarinoborba/socialflow
          tags: |
            type=raw,value=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=SocialFlow
            org.opencontainers.image.description=SocialFlow unified container image for Web, API, Worker and Migrations
            org.opencontainers.image.source=https://github.com/DevArinoBorba/SocialFlow
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
