# Test-only overrides; no data service ports in the base production topology.
services:
  postgres:
    ports: ["127.0.0.1:${TEST_DB_PORT:-55432}:5432"]
  redis:
    ports: ["127.0.0.1:${TEST_REDIS_PORT:-56379}:6379"]
  api:
    environment:
      MEDIA_S3_ENDPOINT: http://media-storage:9000
      MEDIA_S3_BUCKET: socialflow-media-test
      MEDIA_S3_ACCESS_KEY_ID: socialflow-test
      MEDIA_S3_SECRET_ACCESS_KEY: isolated-media-test-secret
      META_APP_ID: ${META_APP_ID:-meta-test-app-id}
      META_APP_SECRET: ${META_APP_SECRET:-meta-test-app-secret}
      META_GRAPH_URL: ${META_GRAPH_URL:-http://host.docker.internal:54321}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:-0123456789abcdef0123456789abcdef}
      META_CONFIG_ID: ${META_CONFIG_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      media-storage: { condition: service_healthy }
    ports: ["127.0.0.1:${TEST_API_PORT:-53001}:3001"]
  worker:
    ports: ["127.0.0.1:${TEST_WORKER_PORT:-53002}:3002"]
  web:
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
  media-storage:
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    entrypoint:
      [
        "sh",
        "-c",
        "mkdir -p /data/socialflow-media-test && exec minio server /data",
      ]
    environment:
      MINIO_ROOT_USER: socialflow-test
      MINIO_ROOT_PASSWORD: isolated-media-test-secret
    ports: ["127.0.0.1:${TEST_STORAGE_PORT:-59000}:9000"]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 2s
      timeout: 2s
      retries: 30
