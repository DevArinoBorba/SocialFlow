name: socialflow
# Each key here must equal the variable name in its own ${...} reference:
# some deployment tools only substitute required (":?") variables when the
# environment key matches the referenced name, and silently skip it otherwise.
# Compound values (URLs built from a password) are assembled by the
# container's own shell at startup instead, from these self-named parts.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:?Set APP_ENV}
  APP_URL: ${APP_URL:?Set APP_URL}
  RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
x-health: &health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: socialflow_migration
      POSTGRES_DB: socialflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      <<: *health
      test: [CMD-SHELL, "pg_isready -U socialflow_migration -d socialflow"]
    restart: unless-stopped
  redis:
    image: redis:8.10.0-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      [
        sh,
        -c,
        'exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      <<: *health
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
    restart: unless-stopped
  migrate:
    build:
      context: .
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command:
      [
        sh,
        -c,
        'export MIGRATION_DATABASE_URL="postgresql://socialflow_migration:$$POSTGRES_PASSWORD@postgres:5432/socialflow" && exec pnpm db:migrate',
      ]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  api:
    build:
      context: .
      args: { SERVICE: api }
    environment:
      <<: *app-env
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
    command:
      [
        sh,
        -c,
        'export NODE_ENV="$$APP_ENV" DATABASE_URL="postgresql://socialflow_runtime:$$RUNTIME_DB_PASSWORD@postgres:5432/socialflow" REDIS_URL="redis://:$$REDIS_PASSWORD@redis:6379" && exec pnpm --filter @socialflow/api start',
      ]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      <<: *health
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    restart: unless-stopped
  worker:
    build:
      context: .
      args: { SERVICE: worker }
    environment: *app-env
    command:
      [
        sh,
        -c,
        'export NODE_ENV="$$APP_ENV" DATABASE_URL="postgresql://socialflow_runtime:$$RUNTIME_DB_PASSWORD@postgres:5432/socialflow" REDIS_URL="redis://:$$REDIS_PASSWORD@redis:6379" && exec pnpm --filter @socialflow/worker start',
      ]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      <<: *health
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    stop_grace_period: 30s
    restart: unless-stopped
  web:
    build:
      context: .
      args: { SERVICE: web }
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      <<: *health
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    restart: unless-stopped
  seed:
    profiles: [tools]
    build: { context: . }
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV}
      ALLOW_DEV_SEED: "true"
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command:
      [
        sh,
        -c,
        'export NODE_ENV="$$APP_ENV" MIGRATION_DATABASE_URL="postgresql://socialflow_migration:$$POSTGRES_PASSWORD@postgres:5432/socialflow" && exec pnpm db:seed',
      ]
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  postgres_data:
  redis_data:
