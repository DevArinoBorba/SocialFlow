name: socialflow
x-app-env: &app-env
  NODE_ENV: ${APP_ENV:?Set APP_ENV}
  APP_URL: ${APP_URL:?Set APP_URL}
  DATABASE_URL: postgresql://socialflow_runtime:${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD}@postgres:5432/socialflow
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
x-health: &health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: socialflow_migration
      POSTGRES_DB: socialflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      <<: *health
      test: [CMD-SHELL, "pg_isready -U socialflow_migration -d socialflow"]
    restart: unless-stopped
  redis:
    image: redis:8.10.0-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      [
        sh,
        -c,
        'exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      <<: *health
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
    restart: unless-stopped
  migrate:
    build:
      context: .
    environment:
      MIGRATION_DATABASE_URL: postgresql://socialflow_migration:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/socialflow
    command: [pnpm, db:migrate]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  api:
    build:
      context: .
      args: { SERVICE: api }
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      <<: *health
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    restart: unless-stopped
  worker:
    build:
      context: .
      args: { SERVICE: worker }
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      <<: *health
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    stop_grace_period: 30s
    restart: unless-stopped
  web:
    build:
      context: .
      args: { SERVICE: web }
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      <<: *health
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    restart: unless-stopped
  seed:
    profiles: [tools]
    build: { context: . }
    environment:
      NODE_ENV: ${APP_ENV:?Set APP_ENV}
      ALLOW_DEV_SEED: "true"
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-}
      MIGRATION_DATABASE_URL: postgresql://socialflow_migration:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/socialflow
    command: [pnpm, db:seed]
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  postgres_data:
  redis_data:
